# Copy to config/schedule.yaml and edit. The scheduler (`agentbox serve`, or
# `docker compose up`) runs each task on its cron schedule.
#
# These are built-in tasks — you only choose WHEN they run. Each needs just a
# name (which selects the built-in behavior) and a schedule. You normally don't
# write any prompts here.
#
# schedule: standard 5-field cron "min hour dom mon dow" (e.g. "0 8 * * *"), or
#           a descriptor (@hourly, @daily, @weekly). Interpreted in the
#           container's timezone — set AGENTBOX_TIMEZONE.
#
# Built-in task names:
#   daily-briefing    — reads email + calendar, files todos, writes a summary
#                       (adapts to morning/midday/evening by the time it runs)
#   weekly-review     — summarizes the past week
#   process-captures  — files todos/notes from photos dropped in the capture inbox
#
# On (re)start, tasks that run at least daily fire once immediately, so you get
# today's briefing right away. Keep ONE daily-briefing (not three) — it adapts
# to the time of day itself.

tasks:
  - name: process-captures
    schedule: "50 7,12,17 * * *"   # 07:50, 12:50, 17:50 (just before each briefing)

  - name: daily-briefing
    schedule: "0 8,13,18 * * *"    # 08:00, 13:00, 18:00

  - name: weekly-review
    schedule: "0 17 * * 5"         # Fridays at 17:00

# Advanced: to customize what a task does, add your own `prompt:` (free-form
# instructions to the agent) — it overrides the built-in. For example:
#
#   - name: my-custom-digest
#     schedule: "0 7 * * *"
#     prompt: >
#       List my unread emails from the last day and today's calendar, and flag
#       anything urgent.

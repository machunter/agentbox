# agentbox runs as a small stack: the agent plus a local Ollama server that
# provides embeddings for long-term memory. Nothing leaves the machine except
# the LLM calls to the Anthropic API.
#
# One-shot task:
#   docker compose run --rm agentbox "summarize the files in /workspace"
# Long-lived scheduler (runs config/schedule.yaml on cron):
#   mkdir -p config
#   cp schedule.example.yaml config/schedule.yaml   # then edit
#   docker compose up -d                             # starts ollama + the scheduler
#
# The schedule is mounted as a directory (config/), not a single file: on macOS
# a single-file bind mount trips a VirtioFS bug ("resource deadlock avoided")
# from macOS extended attributes. A directory mount sidesteps it.
#
# ANTHROPIC_API_KEY and the optional connector settings come from your shell env
# or a local .env file (compose reads it). Memory and the model cache persist in
# named volumes.

# Shared agent environment, referenced by both the one-shot and scheduler services.
x-agentbox-env: &agentbox-env
  # Model selection (AGENTBOX_MODEL: a claude-* or gemini-* name; default claude-opus-4-8)
  # and the matching API key. Set at least the key for your chosen model.
  AGENTBOX_MODEL: ${AGENTBOX_MODEL:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-}
  AGENTBOX_OLLAMA_URL: http://ollama:11434/api
  AGENTBOX_EMBED_MODEL: ${AGENTBOX_EMBED_MODEL:-nomic-embed-text}
  AGENTBOX_MEMORY_DIR: /data/memory
  AGENTBOX_MAIL_STATE_DIR: ${AGENTBOX_MAIL_STATE_DIR:-/data/memory}
  AGENTBOX_TOOLS_DIR: /data/tools
  AGENTBOX_NAMESPACE: ${AGENTBOX_NAMESPACE:-default}
  AGENTBOX_IMAP_HOST: ${AGENTBOX_IMAP_HOST:-}
  AGENTBOX_IMAP_PORT: ${AGENTBOX_IMAP_PORT:-993}
  AGENTBOX_IMAP_USER: ${AGENTBOX_IMAP_USER:-}
  AGENTBOX_IMAP_PASS: ${AGENTBOX_IMAP_PASS:-}
  AGENTBOX_ICS_URLS: ${AGENTBOX_ICS_URLS:-}
  AGENTBOX_CAL_EMAIL: ${AGENTBOX_CAL_EMAIL:-}
  AGENTBOX_CAL_TIMEOUT: ${AGENTBOX_CAL_TIMEOUT:-}
  AGENTBOX_CAL_CACHE_TTL: ${AGENTBOX_CAL_CACHE_TTL:-}
  AGENTBOX_CAL_CACHE_DIR: ${AGENTBOX_CAL_CACHE_DIR:-/data/memory}
  AGENTBOX_EMAIL_SINCE_DAYS: ${AGENTBOX_EMAIL_SINCE_DAYS:-}
  AGENTBOX_SLACK_TOKEN: ${AGENTBOX_SLACK_TOKEN:-}
  AGENTBOX_SLACK_LOOKBACK_DAYS: ${AGENTBOX_SLACK_LOOKBACK_DAYS:-}
  AGENTBOX_SLACK_TIMEOUT: ${AGENTBOX_SLACK_TIMEOUT:-}
  AGENTBOX_TIMEZONE: ${AGENTBOX_TIMEZONE:-}
  AGENTBOX_CAPTURE_DIR: /data/captures
  AGENTBOX_JOURNAL_DIR: /data/journal
  AGENTBOX_MAX_TOOL_CALLS: ${AGENTBOX_MAX_TOOL_CALLS:-}
  AGENTBOX_DEBUG: ${AGENTBOX_DEBUG:-}

x-agentbox-deps: &agentbox-deps
  ollama:
    condition: service_healthy
  ollama-init:
    condition: service_completed_successfully

services:
  # Local embedding server. No host port is published — only agentbox reaches it
  # over the compose network.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One-shot: pull the embedding model into the ollama server, then exit.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "${AGENTBOX_EMBED_MODEL:-nomic-embed-text}"]
    restart: "no"

  # One-shot agent for ad-hoc tasks. Behind a profile so `docker compose up`
  # doesn't start it; use `docker compose run --rm agentbox "<task>"`.
  agentbox:
    build: .
    profiles: ["oneshot"]
    depends_on: *agentbox-deps
    environment: *agentbox-env
    volumes:
      - ${AGENTBOX_WORKSPACE:-.}:/workspace
      - agentbox_memory:/data/memory
      - ${AGENTBOX_CAPTURE_HOST:-./captures}:/data/captures
      - ${AGENTBOX_JOURNAL_HOST:-./journal}:/data/journal
      - ${AGENTBOX_TOOLS_HOST:-./tools}:/data/tools

  # Long-lived scheduler: runs schedule.yaml's tasks on their cron schedules.
  # Started by `docker compose up`.
  agentbox-scheduler:
    build: .
    command: ["serve"]
    restart: unless-stopped
    depends_on: *agentbox-deps
    environment:
      <<: *agentbox-env
      AGENTBOX_SCHEDULE: /etc/agentbox/schedule.yaml
      AGENTBOX_PROMPTS_DIR: /etc/agentbox/prompts   # optional per-task prompt overrides
    volumes:
      - ${AGENTBOX_WORKSPACE:-.}:/workspace
      - agentbox_memory:/data/memory
      - ${AGENTBOX_CAPTURE_HOST:-./captures}:/data/captures
      - ${AGENTBOX_JOURNAL_HOST:-./journal}:/data/journal
      - ${AGENTBOX_TOOLS_HOST:-./tools}:/data/tools
      # Mount the directory holding schedule.yaml (not the file) — see header note.
      - ${AGENTBOX_CONFIG_DIR:-./config}:/etc/agentbox:ro

volumes:
  ollama_models:
  agentbox_memory:
